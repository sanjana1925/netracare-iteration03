# NetraCare Iteration 3 with Docker Compose.
#   1. copy backend/.env.example to backend/.env and put your LLM key in it (see README)
#   2. docker compose up --build        then open  http://localhost:5175   (API docs: http://localhost:8003/docs)
#   docker compose down                 stops it (the database is kept);  docker compose down -v  also deletes the database
#
# Data: data packs 1, 2 and 3 (baked into the backend image). There are no upcoming bookings at the start; data pack 2 adds 27 past visits;
# data pack 3 is the clinic documents the patient chat answers from (the index is built while the image is built).
# Without an API key the app still runs: the Fact of the Day and doctor summary show fallbacks, booking is refused (no red-flag check)
# and the chat says "We couldn't check your message just now".
# Optional, for the fixed-clock demo of the data pack 1 README:
#   NETRACARE_SEED_APPOINTMENTS=1 CLINIC_NOW=2026-11-02T10:00 docker compose up --build
name: netracare-iteration3

services:
  backend:
    build: ./backend
    env_file:
      - path: ./backend/.env                 # LLM_PROVIDER, LLM_MODEL, the API key, LLM_TIMEOUT. Optional: the app runs without it
        required: false
    environment:
      NETRACARE_SEED_APPOINTMENTS: "${NETRACARE_SEED_APPOINTMENTS:-0}"
      CLINIC_NOW: "${CLINIC_NOW:-}"          # empty = the real clock
      TZ: "${CLINIC_TZ:-Asia/Kolkata}"       # the clinic's timezone: the container would otherwise run on UTC, which
                                             # makes "now" (and the 2-hour cancel cut-off) 5.5 hours behind a clinic in India
    volumes:
      - netracare-data:/data                 # the SQLite database survives restarts
    ports:
      - "8003:8000"                          # FastAPI /docs and the API, for trying endpoints by hand
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5175:80"                            # the website
    restart: unless-stopped

volumes:
  netracare-data:
